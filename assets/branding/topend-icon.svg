<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- TopEnd: a response that runs flat, dips slightly and lifts into the top end.
       The bright curve is what quiet detail receives; the dim one is the smaller
       lift that loud material gets. Amber to mint follows Mid Air to High Air. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e33"/>
      <stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="740" y2="0">
      <stop offset="0" stop-color="#f0b86e"/>
      <stop offset="1" stop-color="#6fe0c8"/>
    </linearGradient>
    <linearGradient id="lift" gradientUnits="userSpaceOnUse" x1="0" y1="354" x2="0" y2="634">
      <stop offset="0" stop-color="#6fe0c8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6fe0c8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <g clip-path="url(#squircle)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Decade grid and the 0 dB line. -->
    <g stroke="#ffffff" stroke-width="3" stroke-opacity="0.05">
      <line x1="306" y1="100" x2="306" y2="924"/>
      <line x1="512" y1="100" x2="512" y2="924"/>
      <line x1="718" y1="100" x2="718" y2="924"/>
    </g>
    <line x1="100" y1="634" x2="924" y2="634" stroke="#ffffff" stroke-width="4" stroke-opacity="0.12"/>
    <!-- Lift under the quiet-detail curve. -->
    <path d="M150 634 L360 634 C410 634 440 674 486 674 C560 674 596 374 700 360 C760 352 820 350 924 350 L924 634 Z"
          fill="url(#lift)" stroke="none"/>
    <!-- Loud material: a smaller lift. -->
    <path d="M150 634 L360 634 C410 634 440 652 486 652 C560 652 600 516 700 508 C760 504 820 504 924 504"
          stroke="#eef1ee" stroke-opacity="0.26" stroke-width="18"/>
    <!-- Quiet detail: the full lift. -->
    <path d="M150 634 L360 634 C410 634 440 674 486 674 C560 674 596 374 700 360 C760 352 820 350 924 350"
          stroke="url(#band)" stroke-width="36"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
